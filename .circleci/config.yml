
version: 2.1
orbs:
  python: circleci/python@2.1.1

parameters:
  eval-mode:
    type: string
    default: "commit"

workflows:
  evaluate-app:
    jobs:
      - run-commit-evals:
          context:
            - dl-ai-courses

jobs:
  run-commit-evals:
    docker:
      - image: cimg/python:3.10.5
    steps:
      - checkout

      # Install uv (via pipx or curl)
      - run:
          name: Install uv
          command: |
            pip install --upgrade pip setuptools wheel
            pip install uv

      # Replace pip install with uv sync
      - run:
          name: Install dependencies with uv
          command: |
            uv pip install -r requirements.txt --system

      # Run your tests
      - run:
          name: Run assistant evals
          command: uv run pytest test_assistant.py
